[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-insights-portfolio"
version = "1.1.0"
description = "Real daily retail operations forecasting, weekly demand research and explicitly simulated pricing and NLP diagnostics."
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0",
  "scikit-learn==1.8.0", "matplotlib==3.10.8", "openpyxl==3.1.5", "duckdb==1.5.6",
  "xgboost-cpu==3.1.3; platform_system == 'Linux'",
  "xgboost==3.1.3; platform_system != 'Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1", "jupyterlab>=4,<5", "ruff>=0.11,<1"]
explain = ["shap==0.50.0", "numba==0.63.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
